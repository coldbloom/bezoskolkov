# Include inside the existing HTTPS server {} for oknoshield.site.
# Keep its root, index, location /, error_page and certificate settings.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    application/xml
    text/plain
    text/x-component;

etag on;

# HTML and App Router payloads must be revalidated after a new export.
add_header Cache-Control "no-cache" always;

# These filenames contain a content hash and change with their contents.
location ^~ /_next/static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# AVIF is not present in every nginx 1.24 mime.types file.
location ~* \.avif$ {
    types { image/avif avif; }
    default_type image/avif;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}

# Public filenames stay the same when an image is replaced.
location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}

# In nginx 1.24, add_header replaces the headers inherited from the parent level.
# Preserve any http-level security headers here and server headers in the asset locations.
